<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-do list</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
        <script src="https://kit.fontawesome.com/987207e80e.js" crossorigin="anonymous"></script>
    </head>

<body>
    <div class="container">
        <div class="navBar">
            <div class="searchBar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for your tasks">
            </div>
            <div class="navBar-icons">
                <button class="icn-buttons"> 
                   <i class="fa-solid fa-bell"></i>
                   <span class="notif-dot"></span> 
                </button>
                <button class="icn-buttons"><i class="fa-regular fa-circle-user"></i></button>
            </div>
        </div> 
        <div class="main">
            <div class="greeting">Good <span class="greeting"id= "greetingTime"></span></div>
            <h1 class="h1-add">
                You've got&nbsp; <span class="taskCount" id="task-count"></span> &nbsp;tasks today
               <button class="add-btn" onclick="openModal()">
                   <i class="fa-solid fa-plus"></i>
                   Add New
               </button>
            </h1>
            <div class="section">
                <div class="section-heading" id ="onHold"> <h2>On Hold</h2></div>
                 <div id="taskList"></div>          
            </div>
            <div class="section">
                <div class="section-heading"> 
                   <h2>Completed</h2>
                    <span class="badge badge-inactive">Inactive</span>
                </div>
                <div id="completedList"></div>
            </div>

        </div>
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Results Summary</div>
                <div class="stat-card">
                    <div class="stat-label">Completion Rate</div>
                    <div class="stat-value" id="completionRate">0%</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="completionRateFill" style="width:0%"></div>
                    </div>

                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Tasks</div>
                    <div class="stat-value" id="totalTasksCount">0</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="totalTasksFill" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" id="completedTasksCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending</div>
                    <div class="stat-value" id="pendingTasksCount">0</div>
                </div>
            </div>
        </div>
    </div>
    <div class="confirm-delete"  id="confirmDelete">
        Do you want to delete task?
        <div class="conf-btns">
            <button class="btn" id="btnYes" onclick="deleteTask()">Yes</button>
            <button class="btn" id="btnNo" onclick="closeConfirmation()">No</button>
        </div>
    </div>
    <div class="modal" id="taskModal">
        <div class="modal-content">
           
            <h2 class="modal-title">Add/Edit Task</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title:</label>
                    <input type="text" id="taskTitle" name="taskTitle" required placeholder="Enter task name">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="taskStatus" name="taskStatus" required>
                        <option value="pending">Pending</option>
                        <option value="progress">In Progress</option>
                        <option value="completed">Completed</option>             
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="taskPriority" name="taskPriority" required>
                        <option value="minor">Minor</option>
                        <option value="normal">Normal</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancel</button> 
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
                

            </form>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
